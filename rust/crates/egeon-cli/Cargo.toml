[package]
name = "egeon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "egeon_cli"
path = "src/lib.rs"

[[bin]]
name = "egeon"
path = "src/main.rs"

# O core entra só pelos caminhos (`commons::paths`): o socket é o mesmo que o
# `egeon-app` abre, e a guarda contra o `~/.egeon` estável vem junto.
[dependencies]
egeon-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
