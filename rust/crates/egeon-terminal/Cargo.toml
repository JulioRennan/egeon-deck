[package]
name = "egeon-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Com `links`, o cargo recusa um segundo crate que ligue o libghostty-vt: duas
# cópias do `.a` no mesmo binário dariam símbolos duplicados.
links = "ghostty-vt"

# Dependências entram quando o código que as usa entrar; a direção permitida
# está na skill `padrao-rust`.
[dependencies]
egeon-core.workspace = true
fancy-regex.workspace = true

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
sha2.workspace = true
zip.workspace = true

[lints]
workspace = true
